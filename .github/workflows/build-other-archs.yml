name: Build on other architectures (QEMU)

on:
  # Manual trigger only. Builds and tests on CPU architectures without GitHub hosted
  # runners, emulated with QEMU. Native x86_64 and ARM64 builds run in the main CI workflow (ci.yml).
  workflow_dispatch:

# No githubToken for run-on-arch-action: with it the action caches its container images as
# packages of the repository owner (one per arch and distro, never deleted). The install step
# runs on every run instead.
permissions:
  contents: read

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}
    timeout-minutes: 60
    # New architectures are allowed to fail until they are known to work
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit ARM, Debian is the base of Raspberry Pi OS
          - arch: armv7
            distro: bookworm
            experimental: false
          # ARM64, Debian with distro FPC and older glibc
          - arch: aarch64
            distro: bookworm
            experimental: false
          # 64-bit POWER, little endian
          - arch: ppc64le
            distro: ubuntu_latest
            experimental: true

    steps:
      - uses: actions/checkout@v7

      # Suffix of the archive names (dev-<date>, none for v* tags), computed here
      # as the container may have no git
      - name: Release archive names
        shell: bash
        run:  bash Scripts/ci/release_suffix.sh

      - uses: uraimo/run-on-arch-action@v3
        name: Build binaries
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}

          env: |
            DESKEW_RELEASE_SUFFIX: ${{ env.DESKEW_RELEASE_SUFFIX }}

          install: |
            apt-get update -q -y
            apt-get install -q -y fpc python3
            # For the release archive
            apt-get install -q -y zip

          run: |
            echo "OS:" $(grep PRETTY_NAME /etc/os-release | cut -d= -f2) "/" $(uname -m)
            echo "FPC:" $(fpc -iWTPTO)
            echo

            ./Scripts/compile.sh
            ./Scripts/tests-compile.sh

            cd Bin
            ls -lh ./

            ./tests -a -p --format=plain --no-addresses
            ./runtests.sh
            python3 ../Tests/cli/check_cli.py ./deskew
            cd ..

            # Release archive with the command line tool only (no Lazarus and GUI here)
            if [ "${{ matrix.arch }}" = "armv7" ]; then
              ./Scripts/package_release.sh linux-armv7
            fi

      - name: Upload release archive
        if: matrix.arch == 'armv7'
        uses: actions/upload-artifact@v7
        # archive: false uploads the release ZIP as it is, not wrapped in another ZIP
        with:
          path: Releases/deskew-*.zip
          archive: false
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: deskew-binaries-${{ matrix.arch }}-${{ matrix.distro }}
          path: |
            Bin/deskew*
          if-no-files-found: error

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: deskew-artifacts-${{ matrix.arch }}-${{ matrix.distro }}
          path: |
            Bin
          if-no-files-found: error
