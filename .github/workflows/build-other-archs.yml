name: Build on other architectures (QEMU)

on:
  # Manual trigger only. Builds and tests on CPU architectures without GitHub hosted
  # runners, emulated with QEMU. Native x86_64 and ARM64 builds run in the main CI workflow (ci.yml).
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # run-on-arch-action caches its Docker images in the GitHub package registry

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}
    timeout-minutes: 60
    # New architectures are allowed to fail until they are known to work
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit ARM, Debian is the base of Raspberry Pi OS
          - arch: armv7
            distro: bookworm
            experimental: false
          # ARM64, Debian with distro FPC and older glibc
          - arch: aarch64
            distro: bookworm
            experimental: false
          # 64-bit POWER, little endian
          - arch: ppc64le
            distro: ubuntu_latest
            experimental: true

    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        name: Build binaries
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}

          githubToken: ${{ github.token }}

          install: |
            apt-get update -q -y
            apt-get install -q -y fpc
            # Just get the -dev with unversioned symlink, instead of libtiff5 vs libtiff6 in different distro versions
            apt-get install -q -y libtiff-dev

          run: |
            echo "OS:" $(grep PRETTY_NAME /etc/os-release | cut -d= -f2) "/" $(uname -m)
            echo "FPC:" $(fpc -iWTPTO)
            echo

            ./Scripts/compile.sh
            ./Scripts/tests-compile.sh

            cd Bin
            ls -lh ./

            ./tests -a -p --format=plain --no-addresses
            ./runtests.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: deskew-binaries-${{ matrix.arch }}-${{ matrix.distro }}
          path: |
            Bin/deskew*
          if-no-files-found: error

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: deskew-artifacts-${{ matrix.arch }}-${{ matrix.distro }}
          path: |
            Bin
          if-no-files-found: error
