name: CI

on:
  # On each push to master, on version tags (release builds) and manual trigger
  push:
    branches: [ master ]
    tags: [ "v*" ]
    paths-ignore: [ "**/Readme.md" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imaging-sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Bundled Imaging must match the imaginglib commit recorded in Imaging/IMAGING_SYNC.txt
      - name: Check Imaging/ is in sync
        run: ./Scripts/sync_imaging.sh check

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # "target" is the name of the release platform for Scripts/build_release.sh and package_release.sh
        include:
          # Windows x86_64 (32-bit Windows binaries are cross compiled here too)
          - operating-system: windows-latest
            target: win-x64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-cross-i386-win32-win64.exe

          # Ubuntu x86_64
          - operating-system: ubuntu-latest
            target: linux-x64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-src_3.2.2-210709_amd64.deb

          # Ubuntu ARM64
          - operating-system: ubuntu-24.04-arm
            target: linux-arm64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_arm64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-laz_3.2.3-240813_arm64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-src_3.2.3-240813_arm64.deb

          # macOS ARM64
          - operating-system: macos-latest
            target: macos-arm64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg

          # macOS x86_64
          - operating-system: macos-15-intel
            target: macos-x64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg

    steps:
      - uses: actions/checkout@v7

      - name: Install FPC & Lazarus
        uses: ollydev/setup-lazarus@v4.1
        with:
          laz-url: ${{ matrix.laz-url }}
          fpc-url: ${{ matrix.fpc-url }}

      - name: Setup Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Add FPC to PATH
          LAZ_DIR="$RUNNER_TEMP/lazarus"
          FPC_BIN=$(find "$LAZ_DIR/" -type f -executable -name "fpc.exe" | head -1)
          FPC_DIR=$(dirname "$FPC_BIN")
          echo "Found FPC: $FPC_BIN"
          echo "$FPC_DIR" >> $GITHUB_PATH

      - name: Setup Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Shared libraries Deskew uses when they are found (zlib is always there), so the
          # tests go through them. -dev packages to get the same names in all distro versions.
          sudo apt install libtiff-dev libturbojpeg0-dev libwebp-dev -y

          # For the GUI test builds with other LCL widget sets than the default GTK2
          sudo apt install libgtk-3-dev libqt5pas-dev -y
          # libqt6pas of Ubuntu is too old for Lazarus 4.x, get a newer release
          BASE_URL=https://github.com/davidbannon/libqt6pas/releases/download/v6.2.10
          if [ "$RUNNER_ARCH" == "X64" ]; then DEB_ARCH=amd64; else DEB_ARCH=arm64; fi
          for pkg in libqt6pas6 libqt6pas6-dev; do
              wget -q $BASE_URL/${pkg}_6.2.10-1_$DEB_ARCH.deb
              sudo apt install ./${pkg}_6.2.10-1_$DEB_ARCH.deb -y
          done

      - name: Setup macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true  # Silence the warnings on macOS runners, we don't need AWS stuff

      - name: Print info
        shell: bash
        run: |
          echo "Lazarus:" $(lazbuild --version)
          echo "FPC:" $(fpc -iWTPTO)
          echo "OS: "$RUNNER_OS", ARCH:" $RUNNER_ARCH
          echo "    "$(uname -a)
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "    "$(lsb_release -d)
          fi
          ./Scripts/get_versions.sh

      # Suffix of the archive names: none for v* tags (must match the version), dev-<date> otherwise
      - name: Release archive names
        shell: bash
        run:  bash Scripts/ci/release_suffix.sh

      - name: Build Deskew CLI and GUI
        shell: bash
        run:  ./Scripts/build_release.sh ${{ matrix.target }}

      # Checks that the GUI builds with the other LCL widget sets of Linux (the release
      # has Qt6 and GTK2 builds). Built after the release ones as LCL is rebuilt for each.
      - name: Build Deskew GUI with Qt5 and GTK3
        if: runner.os == 'Linux'
        shell: bash
        run:  |
          for ws in qt5 gtk3; do
              lazbuild --build-mode=Release --ws=$ws --opt="-o$PWD/Bin/deskewgui-$ws" "Gui/deskewgui.lpi"
          done

      - name: Build unit tests
        shell: bash
        run:  lazbuild "Tests/tests.lpi"

      # GUI settings, helpers and their parameters checked with the CLI built above.
      # Console program with the LCL "nogui" widgetset, no display needed.
      - name: Build GUI unit tests
        shell: bash
        run:  lazbuild "Tests/gui/guitests.lpi"

      # The Linux build above uses the shared libraries installed in Setup Linux. This
      # extra build never looks for them (DESKEW_PASCAL_CODECS_ONLY, see ImagingUserOptions.inc),
      # so the smoke tests check the Pascal codecs other users get too.
      - name: Build Deskew CLI with Pascal codecs only
        if: runner.os == 'Linux'
        shell: bash
        run:  |
          mkdir -p Bin/pascal Dcu/pascal
          fpc -B -O1 -Mdelphi -vn- -FEBin/pascal -FUDcu/pascal -FuImaging -FuImaging/Libs \
            -FiImaging -Fi. -dIMAGING_USER_OPTIONS -dDESKEW_PASCAL_CODECS_ONLY deskew.lpr

      - name: List Bin directory
        shell: bash
        run:  ls -lh Bin

      - name: Run tests
        shell: bash
        run:   |
          cd Bin
          ./tests -a -p --format=plain --no-addresses
          ./guitests -a -p --format=plain --no-addresses

          if [ "$RUNNER_OS" == "Linux" ]; then
              # Each build must really use what it is meant to
              ./deskew -s l -g d ../TestImages/F1550.jpg > libs.txt
              for lib in "zlib: *dynlib" "JPEG: *TurboJPEG" "TIFF: *libtiff" "WebP: *libwebp"; do
                  grep -q "$lib" libs.txt || { cat libs.txt; echo "Shared library not used: $lib"; exit 1; }
              done
              ./pascal/deskew -s l -g d ../TestImages/F1550.jpg > libs.txt
              if grep -qiE "dynlib|turbojpeg|libtiff|libwebp" libs.txt; then
                  cat libs.txt; echo "Pascal codecs only build uses a shared library"; exit 1
              fi
              rm libs.txt

              ./runtests.sh
              ./runtests.sh pascal/deskew
              # Results (angles, output formats, copies, errors), not only exit codes
              python3 ../Tests/cli/check_cli.py ./deskew
              python3 ../Tests/cli/check_cli.py ./pascal/deskew
          elif [ "$RUNNER_OS" == "Windows" ]; then
              ./RunTests.bat
              python ../Tests/cli/check_cli.py ./deskew.exe
          elif [ "$RUNNER_OS" == "macOS" ]; then
              ./runtests.sh
              python3 ../Tests/cli/check_cli.py ./deskew
          fi

      - name: Package release archive
        shell: bash
        run:  ./Scripts/package_release.sh ${{ matrix.target }}

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        # archive: false uploads the release ZIP as it is, not wrapped in another ZIP
        with:
          path: Releases/deskew-*.zip
          archive: false
          if-no-files-found: error

      # GUIs are started and must show their main window: catches startup crashes and
      # missing shared libraries. GUIs of the release archive are started from its folder
      # (Releases/<name>/, Linux Qt6 build loads libQt6Pas.so.6 of the archive, macOS GUI
      # from the application bundle). Screenshots go to Bin/gui-smoke (in the artifacts).
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          REL=$(echo Releases/deskew-*-${{ matrix.target }})
          # Window manager: Qt does not paint its dialogs under bare Xvfb
          sudo apt install -y -q xvfb xdotool imagemagick openbox
          xvfb-run -a -s "-screen 0 1280x1024x24" bash Scripts/ci/gui_smoke.sh Bin/gui-smoke $REL/deskewgui $REL/deskewgui-gtk2 Bin/deskewgui-qt5
          # GTK3 build is known to be broken with Lazarus 4.8, reported only
          xvfb-run -a -s "-screen 0 1280x1024x24" bash Scripts/ci/gui_smoke.sh Bin/gui-smoke Bin/deskewgui-gtk3 || echo "::warning::GTK3 GUI build did not show its window"

      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pwsh -File Scripts/ci/gui_smoke.ps1 -OutDir Bin/gui-smoke -Exe "$(echo Releases/deskew-*-${{ matrix.target }})/deskewgui.exe"

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash Scripts/ci/gui_smoke.sh Bin/gui-smoke "$(echo Releases/deskew-*-${{ matrix.target }})/DeskewGui.app/Contents/MacOS/deskewgui"

      # 32-bit Windows binaries are cross compiled on the 64-bit runner
      - name: Build, test and package win-x86
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          ./Scripts/build_release.sh win-x86
          (cd Bin && ./RunTests.bat)
          ./Scripts/package_release.sh win-x86
          pwsh -File Scripts/ci/gui_smoke.ps1 -OutDir Bin/gui-smoke/win-x86 -Exe "$(echo Releases/deskew-*-win-x86)/deskewgui.exe"

      - name: Upload win-x86 release archive
        if: matrix.target == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          path: Releases/deskew-*-win-x86.zip
          archive: false
          if-no-files-found: error

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: deskew-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: |
            Bin
          if-no-files-found: error

  # WebUI: CLI built for WebAssembly (wasm32-wasip1) with FPC trunk, tested in Node
  # and headless Chromium
  web:
    # Not ubuntu-latest: Playwright has no browser builds for Ubuntu 26.04 yet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Same fpclazup and commits as the FPC trunk job of Imaging (imaginglib ci.yml),
      # keep them in sync. setup-lazarus does not download fpclazup when FPC comes from cache.
      FPCLAZUP_URL: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v2.4.0i/fpclazup-x86_64-linux
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - uses: actions/checkout@v7

      # Lazarus is built too (setup-lazarus always does in fpclazup mode), the
      # whole installation is cached by commits
      - name: Install FPC trunk (fpclazup)
        uses: ollydev/setup-lazarus@v4.1
        with:
          fpclazup-url: ${{ env.FPCLAZUP_URL }}
          fpclazup-lazcommit: 121cf87c5e # Lazarus trunk 2026-11-03
          fpclazup-fpccommit: 4cb8012b64 # FPC trunk 3.3.1 2026-11-03

      # The cross compiler is added to the installation of FPC trunk. setup-lazarus saves
      # the installation in its post step only when its cache key was missing, apparently also
      # when the job fails, so a cache without the cross compiler is possible: then it is
      # built in every run (until that cache expires or is deleted).
      # wasm-ld comes from lld and libc.a (which fpclazup requires) from wasi-libc of
      # Ubuntu. fpclazup is not asked to download them (--autotools), those downloads
      # failed often and fpclazup then crashed.
      - name: Install FPC cross compiler for WASM (wasip1)
        shell: bash
        run: |
          INSTALL_DIR="$RUNNER_TEMP/fpclazup/"
          # Installed in every run, the cached installation refers to them
          sudo apt-get install -y -q lld llvm wasi-libc
          CROSS_BIN="$INSTALL_DIR/cross-system/wasm32-wasip1/bin"
          mkdir -p "$CROSS_BIN"
          CROSS_LIB=$(dirname "$(dpkg -L wasi-libc | grep -E '/wasm32-wasi(p1)?/libc\.a$' | head -1)")
          if [ ! -f "$CROSS_LIB/libc.a" ]; then echo "libc.a of wasi-libc not found"; exit 1; fi
          echo "wasi-libc: $CROSS_LIB"
          for tool in wasm-ld llvm-mc; do
            TOOL_PATH=$(command -v $tool || ls /usr/lib/llvm-*/bin/$tool 2>/dev/null | sort -V | tail -1)
            if [ -z "$TOOL_PATH" ]; then echo "$tool not found"; exit 1; fi
            # Also with the binutils prefix of the target, in case it is used
            ln -sf "$TOOL_PATH" "$CROSS_BIN/$tool"
            ln -sf "$TOOL_PATH" "$CROSS_BIN/wasm32-wasip1-$tool"
          done
          "$CROSS_BIN/wasm-ld" --version

          if [ -n "$(find "$INSTALL_DIR" -type f -name ppcrosswasm32 -print -quit)" ]; then
            echo "Cross compiler for wasm32-wasip1 already installed"
          else
            FPCLAZUP_BIN="$RUNNER_TEMP/fpclazupbin"
            if [ ! -x "$FPCLAZUP_BIN" ]; then
              curl -sSfL --retry 3 -o "$FPCLAZUP_BIN" "$FPCLAZUP_URL"
              chmod +x "$FPCLAZUP_BIN"
            fi
            for attempt in 1 2 3; do
              if "$FPCLAZUP_BIN" --only=FPCCleanOnly,FPCBuildOnly --cputarget=wasm32 --ostarget=wasip1 \
                  --crossbindir="$CROSS_BIN" --crosslibdir="$CROSS_LIB" \
                  --noconfirm --verbose --installdir="$INSTALL_DIR"; then
                break
              fi
              if [ $attempt = 3 ]; then exit 1; fi
              echo "fpclazup failed, attempt $attempt of 3, trying again in 30 s"
              sleep 30
            done
          fi
          # setup-lazarus in fpclazup mode puts only Lazarus on PATH, use fpc.sh wrapper of the install
          FPC=$(ls "$INSTALL_DIR"/fpc/bin/*/fpc.sh | head -1)
          echo "FPC=$FPC" >> $GITHUB_ENV
          echo "FPC cross compiler:" $("$FPC" -Pwasm32 -Twasip1 -iVTPTO)

      # Scripts/compile-wasm.sh does not use the options that are broken in FPC trunk for
      # wasm32-wasip1 (as found by Imaging CI): -Xg (module wasmtime cannot parse)
      # and smart linking -CX -XX (compiler crashes while linking)
      - name: Build Deskew CLI for WASM
        shell: bash
        run: |
          ./Scripts/compile-wasm.sh
          ls -lh Web/deskew.wasm

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test WASM build in Node
        shell: bash
        run: node Tests/web/test-wasi.mjs

      - name: Test web GUI in headless Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@$PLAYWRIGHT_VERSION
          npx playwright install --with-deps chromium
          mkdir -p Bin/web-screenshots
          node Tests/web/test-page.mjs Bin/web-screenshots

      - name: Release archive names
        shell: bash
        run:  bash Scripts/ci/release_suffix.sh

      # Static site, ready to be served (python3 -m http.server, GitHub Pages, ...),
      # packed like the other release archives: Releases/deskew-<version>-web.zip with
      # a deskew-<version>-web folder inside (version of the CLI = the engine,
      # RELEASE_VERSION with the dev-<date> suffix for builds that are not releases)
      - name: Assemble WebUI
        shell: bash
        env:
          # Head of the PR branch, github.sha of a PR run is a merge commit nobody can open
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          . Scripts/get_versions.sh
          NAME=deskew-$RELEASE_VERSION-web
          SITE=Releases/$NAME
          mkdir -p "$SITE"
          cp Web/index.html Web/app.js Web/worker.js Web/wasi.js Web/style.css Web/deskew.wasm Web/Readme.md "$SITE/"
          # Stamp the WebUI build shown in the page footer (Web/version.js marks a dev build)
          echo "export const WEBUI_BUILD = { date: '$(date -u +%F)', commit: '$BUILD_COMMIT' };" > "$SITE/version.js"                    
          cp LICENSE "$SITE/"
          ls -lh "$SITE"
          (cd Releases && zip -r -9 -q "$NAME.zip" "$NAME")

      - name: Upload WebUI
        uses: actions/upload-artifact@v7        
        with:
          path: Releases/deskew-*-web.zip
          archive: false
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deskew-web-screenshots
          path: Bin/web-screenshots
          if-no-files-found: ignore
