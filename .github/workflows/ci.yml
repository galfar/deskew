name: CI

on:
  # On each push and manual trigger
  push:
    branches: [ master ]
    paths-ignore: [ "**/Readme.md" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imaging-sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Bundled Imaging must match the imaginglib commit recorded in Imaging/IMAGING_SYNC.txt
      - name: Check Imaging/ is in sync
        run: ./Scripts/sync_imaging.sh check

  build:
    name: build (${{ matrix.operating-system }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - operating-system: windows-latest
            arch: x86_64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-cross-i386-win32-win64.exe

          # Ubuntu x86_64
          - operating-system: ubuntu-latest
            arch: x86_64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-src_3.2.2-210709_amd64.deb

          # Ubuntu ARM64
          - operating-system: ubuntu-24.04-arm
            arch: arm64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_arm64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-laz_3.2.3-240813_arm64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-src_3.2.3-240813_arm64.deb

          # macOS ARM64
          - operating-system: macos-latest
            arch: arm64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg

          # macOS x86_64
          - operating-system: macos-15-intel
            arch: x86_64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg

    steps:
      - uses: actions/checkout@v7

      - name: Install FPC & Lazarus
        uses: ollydev/setup-lazarus@v4.1
        with:
          laz-url: ${{ matrix.laz-url }}
          fpc-url: ${{ matrix.fpc-url }}

      - name: Setup Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Add FPC to PATH
          LAZ_DIR="$RUNNER_TEMP/lazarus"
          FPC_BIN=$(find "$LAZ_DIR/" -type f -executable -name "fpc.exe" | head -1)
          FPC_DIR=$(dirname "$FPC_BIN")
          echo "Found FPC: $FPC_BIN"
          echo "$FPC_DIR" >> $GITHUB_PATH

      - name: Setup Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # For the test build that reads and writes TIFF through libtiff (see below).
          # Just get the -dev with unversioned symlink, instead of libtiff5 vs libtiff6 in different distro versions
          sudo apt install libtiff-dev -y

      - name: Setup macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true  # Silence the warnings on macOS runners, we don't need AWS stuff

      - name: Print info
        shell: bash
        run: |
          echo "Lazarus:" $(lazbuild --version)
          echo "FPC:" $(fpc -iWTPTO)
          echo "OS: "$RUNNER_OS", ARCH:" $RUNNER_ARCH
          echo "    "$(uname -a)
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "    "$(lsb_release -d)
          fi

      - name: Build Deskew CLI
        shell: bash
        run:  |
          if [ "$RUNNER_OS" == "macOS" ]; then
              # Release-macOS build mode has x86_64 target CPU set, override it for ARM runners
              if [ "$RUNNER_ARCH" == "ARM64" ]; then CPU=aarch64; else CPU=x86_64; fi
              lazbuild --build-mode=Release-macOS --cpu=$CPU "deskew.lpi"
          else
              lazbuild --build-mode=Release "deskew.lpi"
          fi

      - name: Build Deskew GUI
        shell: bash
        run:   |
          if [ "$RUNNER_OS" == "macOS" ]; then
              if [ "$RUNNER_ARCH" == "ARM64" ]; then CPU=aarch64; else CPU=x86_64; fi
              # Need to specify some older macOS as minimum version, otherwise the LCL linking may fail (new XCode, latest ARM macOS) with "Error: ld: malformed method list atom 'ltmp5' "
              lazbuild --build-mode=Release-macOS --cpu=$CPU --opt="-WM10.14" "Gui/deskewgui.lpi"
          else
              lazbuild --build-mode=Release "Gui/deskewgui.lpi"
          fi

      - name: Build unit tests
        shell: bash
        run:  lazbuild "Tests/tests.lpi"

      # Deskew reads and writes TIFF with the Pascal codec of Imaging. This extra build
      # leaves it out (TIFF_NO_BUNDLED), so TIFF goes through the libtiff shared library
      # and the smoke tests check that path too.
      - name: Build Deskew CLI with libtiff
        if: runner.os == 'Linux'
        shell: bash
        run:  |
          mkdir -p Bin/libtiff Dcu/libtiff
          fpc -B -O1 -Mdelphi -vn- -FEBin/libtiff -FUDcu/libtiff -FuImaging -FuImaging/Libs \
            -FiImaging -Fi. -dIMAGING_USER_OPTIONS -dTIFF_NO_BUNDLED deskew.lpr

      - name: List Bin directory
        shell: bash
        run:  ls -lh Bin

      - name: Run tests
        shell: bash
        run:   |
          cd Bin
          ./tests -a -p --format=plain --no-addresses

          if [ "$RUNNER_OS" == "Linux" ]; then
              ./runtests.sh
              # TIFF through libtiff (the build fails TIFF cases when libtiff cannot be loaded)
              ./runtests.sh libtiff/deskew
          elif [ "$RUNNER_OS" == "Windows" ]; then
              ./RunTests.bat
          elif [ "$RUNNER_OS" == "macOS" ]; then
              ./runtests.sh deskew-mac
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: deskew-binaries-${{ runner.os }}-${{ runner.arch }}
          path: |
            Bin/deskew*
          if-no-files-found: error

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: deskew-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: |
            Bin
          if-no-files-found: error

  # Web GUI: CLI built for WebAssembly (wasm32-wasip1) with FPC trunk, tested in Node
  # and headless Chromium. FPC trunk is a moving target, so this job does not fail CI.
  web:
    # Not ubuntu-latest: Playwright has no browser builds for Ubuntu 26.04 yet
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    env:
      # Same fpclazup and commits as the FPC trunk job of Imaging (imaginglib ci.yml),
      # keep them in sync. setup-lazarus does not download fpclazup when FPC comes from cache.
      FPCLAZUP_URL: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v2.4.0i/fpclazup-x86_64-linux
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - uses: actions/checkout@v7

      # Lazarus is built too (setup-lazarus always does in fpclazup mode), the
      # whole installation is cached by commits
      - name: Install FPC trunk (fpclazup)
        uses: ollydev/setup-lazarus@v4.1
        with:
          fpclazup-url: ${{ env.FPCLAZUP_URL }}
          fpclazup-lazcommit: 121cf87c5e # Lazarus trunk 2026-11-03
          fpclazup-fpccommit: 4cb8012b64 # FPC trunk 3.3.1 2026-11-03

      # Cross compiler and wasm-ld (--autotools) are added to the cached installation,
      # the cache is saved at the end of the job that built them
      - name: Install FPC cross compiler for WASM (wasip1)
        shell: bash
        run: |
          INSTALL_DIR="$RUNNER_TEMP/fpclazup/"
          if [ -n "$(find "$INSTALL_DIR" -type f -name ppcrosswasm32 -print -quit)" ]; then
            echo "Cross compiler for wasm32-wasip1 already installed"
          else
            FPCLAZUP_BIN="$RUNNER_TEMP/fpclazupbin"
            if [ ! -x "$FPCLAZUP_BIN" ]; then
              curl -sSfL -o "$FPCLAZUP_BIN" "$FPCLAZUP_URL"
              chmod +x "$FPCLAZUP_BIN"
            fi
            "$FPCLAZUP_BIN" --only=FPCCleanOnly,FPCBuildOnly --cputarget=wasm32 --ostarget=wasip1 \
              --autotools --noconfirm --verbose --installdir="$INSTALL_DIR"
          fi
          # setup-lazarus in fpclazup mode puts only Lazarus on PATH, use fpc.sh wrapper of the install
          FPC=$(ls "$INSTALL_DIR"/fpc/bin/*/fpc.sh | head -1)
          echo "FPC=$FPC" >> $GITHUB_ENV
          echo "FPC cross compiler:" $("$FPC" -Pwasm32 -Twasip1 -iVTPTO)

      # Scripts/compile-wasm.sh does not use the options that are broken in FPC trunk for
      # wasm32-wasip1 (as found by Imaging CI): -Xg (module wasmtime cannot parse)
      # and smart linking -CX -XX (compiler crashes while linking)
      - name: Build Deskew CLI for WASM
        shell: bash
        run: |
          ./Scripts/compile-wasm.sh
          ls -lh Web/deskew.wasm

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test WASM build in Node
        shell: bash
        run: node Tests/web/test-wasi.mjs

      - name: Test web GUI in headless Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@$PLAYWRIGHT_VERSION
          npx playwright install --with-deps chromium
          mkdir -p Bin/web-screenshots
          node Tests/web/test-page.mjs Bin/web-screenshots

      # Static site, ready to be served (python3 -m http.server, GitHub Pages, ...).
      # The artifact ZIP holds it in a deskew-web folder: upload-artifact strips
      # the given path, so the folder is one level below it.
      - name: Assemble web GUI
        shell: bash
        run: |
          mkdir -p Bin/web/deskew-web
          cp Web/index.html Web/app.js Web/worker.js Web/wasi.js Web/style.css Web/deskew.wasm Bin/web/deskew-web/
          ls -lh Bin/web/deskew-web

      - name: Upload web GUI
        uses: actions/upload-artifact@v7
        with:
          name: deskew-web
          path: Bin/web
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deskew-web-screenshots
          path: Bin/web-screenshots
          if-no-files-found: ignore
